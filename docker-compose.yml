services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftwise
      POSTGRES_USER: shiftwise
      POSTGRES_PASSWORD: shiftwise
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftwise -d shiftwise"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/shiftwise
      DB_USER: shiftwise
      DB_PASSWORD: shiftwise
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-32-chars-min}
    ports:
      - "8080:8080"

volumes:
  pgdata:
