# Render Blueprint for the public live demo (free plan).
# The "demo" profile rebuilds the database from the migrations on every start
# and every night, so visitors always find the same sample data.
databases:
  - name: shiftwise-db
    plan: free
    databaseName: shiftwise
    user: shiftwise

services:
  - type: web
    name: shiftwise-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase: { name: shiftwise-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: shiftwise-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: shiftwise-db, property: database }
      - key: DB_USER
        fromDatabase: { name: shiftwise-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: shiftwise-db, property: password }
