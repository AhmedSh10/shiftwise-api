spring:
  application:
    name: shiftwise-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shiftwise}
    username: ${DB_USER:shiftwise}
    password: ${DB_PASSWORD:shiftwise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

shiftwise:
  jwt:
    # 32+ characters. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32chars}
    ttl-minutes: ${JWT_TTL_MINUTES:480}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
