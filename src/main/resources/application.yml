server:
  port: ${PORT:8080}

spring:
  application:
    name: shiftwise-api
  datasource:
    # DB_URL wins; otherwise built from parts (Render passes host/port/name separately).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shiftwise}${DB_PARAMS:}}
    username: ${DB_USER:shiftwise}
    password: ${DB_PASSWORD:shiftwise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

shiftwise:
  jwt:
    # 32+ characters. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32chars}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  rules:
    # Minimum rest between the end of one working day and the start of the next.
    # 11 h is the Italian legal minimum (D.Lgs. 66/2003); a collective agreement may differ.
    min-rest-hours: ${MIN_REST_HOURS:11}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

---
# Public live demo: wipes and re-seeds the database on start and every night.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    clean-disabled: false
